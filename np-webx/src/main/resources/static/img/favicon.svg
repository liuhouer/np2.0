<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E66"/>
      <stop offset="100%" stop-color="#E07A3A"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 始祖鸟黑曜石圆角徽章底板 -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- 2. NorthPark 北极星罗盘（微光照耀） -->
  <g filter="url(#starGlow)">
    <polygon points="60,12 62.8,18 69.5,20.8 62.8,23.6 60,30 57.2,23.6 50.5,20.8 57.2,18" fill="url(#starGrad)"/>
    <circle cx="60" cy="20.8" r="1.5" fill="#FFF2E8"/>
  </g>

  <!-- 3. 始祖鸟化石骨骼系统 (Arc'teryx Archaeopteryx Silhouette) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- A. 头颅与颈椎 (Skull & Neck) -->
    <!-- 颅骨上缘 -->
    <path d="M60,28 C62.5,26.5 66.5,26 69.5,27.5 C72,28.8 72.8,31 70.5,32.5 C68,33.5 64.5,34 61.5,34.8" stroke-width="1.8"/>
    <!-- 下颚 (Mandible) -->
    <path d="M63.5,32 C67,33 71,34 73.5,35.5 C72.5,37 70,37.2 66,36.5 C63,35.8 61.2,34.8 59.5,34.2" stroke-width="1.6"/>
    <!-- 眼眶孔 (Orbit) -->
    <circle cx="66.5" cy="29.8" r="1" fill="#FFFFFF"/>
    <!-- S形弯曲颈椎 (Cervical Vertebrae) -->
    <path d="M59.5,34.5 C58,36.5 57.2,39 57.8,41.5 C58.2,43.2 59.2,45 60,46.5" stroke-width="2"/>

    <!-- B. 脊柱中轴与骨盆 (Thoracic Spine & Pelvis) -->
    <path d="M60,46.5 L60,76" stroke="#E07A3A" stroke-width="2.6"/>

    <!-- C. 双侧肋骨序列 (Ribcage) -->
    <g stroke-width="1.6" opacity="0.95">
      <!-- 左肋 -->
      <path d="M59,48.5 C55,48 51,50 49,53"/>
      <path d="M59,52.5 C54,53 49,56 47,60"/>
      <path d="M59,56.5 C53,58 48,62 47,66"/>
      <path d="M59,60.5 C54,63 49,67 48,71"/>
      <path d="M60,64.5 C55,67 51,71 50,74"/>
      <!-- 右肋 -->
      <path d="M61,48.5 C65,48 69,50 71,53"/>
      <path d="M61,52.5 C66,53 71,56 73,60"/>
      <path d="M61,56.5 C67,58 72,62 73,66"/>
      <path d="M61,60.5 C66,63 71,67 72,71"/>
      <path d="M60,64.5 C65,67 69,71 70,74"/>
    </g>

    <!-- D. 左翼与三根爪趾 (Left Wing & Claws) -->
    <path d="M58,46.5 C50,43.5 42,41.5 34,43.5 C27,44.5 22,47.5 16,52.5" stroke-width="2.2"/>
    <path d="M34,43.5 C28,39.5 22,36.5 15,35.5" stroke-width="1.8"/>
    <!-- 始祖鸟利爪 -->
    <path d="M15,35.5 Q11,34.5 9,37.5 Q8,39.5 11,39.5 Q13,39.5 15,37.5" stroke-width="1.5"/>
    <path d="M16,52.5 Q11,50.5 8,53.5 Q8,56.5 11,55.5 Q14,54.5 16,53.5" stroke-width="1.5"/>
    <!-- 羽轴放射线 (Remiges Rays) -->
    <g stroke-width="1.2" opacity="0.8">
      <path d="M32,43.5 C24,34.5 17,27.5 11,23.5"/>
      <path d="M37,42.5 C29,31.5 23,23.5 16,17.5"/>
      <path d="M43,43.5 C35,31.5 29,21.5 23,13.5"/>
      <path d="M48,44.5 C42,32.5 37,22.5 31,12.5"/>
    </g>

    <!-- E. 右翼与三根爪趾 (Right Wing & Claws) -->
    <path d="M62,46.5 C70,43.5 78,41.5 86,43.5 C93,44.5 98,47.5 104,52.5" stroke-width="2.2"/>
    <path d="M86,43.5 C92,39.5 98,36.5 105,35.5" stroke-width="1.8"/>
    <!-- 始祖鸟利爪 -->
    <path d="M105,35.5 Q109,34.5 111,37.5 Q112,39.5 109,39.5 Q107,39.5 105,37.5" stroke-width="1.5"/>
    <path d="M104,52.5 Q109,50.5 112,53.5 Q112,56.5 109,55.5 Q106,54.5 104,53.5" stroke-width="1.5"/>
    <!-- 羽轴放射线 -->
    <g stroke-width="1.2" opacity="0.8">
      <path d="M88,43.5 C96,34.5 103,27.5 109,23.5"/>
      <path d="M83,42.5 C91,31.5 97,23.5 104,17.5"/>
      <path d="M77,43.5 C85,31.5 91,21.5 97,13.5"/>
      <path d="M72,44.5 C78,32.5 83,22.5 89,12.5"/>
    </g>

    <!-- F. 后肢抓地/飞爪 (Hind Legs & Claws) -->
    <path d="M58,72 C53,74 47,78 44,84 C42,88 41,92 38,96" stroke-width="1.8"/>
    <path d="M38,96 Q33,98 31,102 Q33,103 36,101" stroke-width="1.4"/>
    <path d="M62,72 C67,74 73,78 76,84 C78,88 79,92 82,96" stroke-width="1.8"/>
    <path d="M82,96 Q87,98 89,102 Q87,103 84,101" stroke-width="1.4"/>

    <!-- G. 多节尾椎骨与羽枝 (Tail Vertebrae & Rectrices) -->
    <g opacity="0.9">
      <path d="M60,76 L60,110" stroke-width="1.8"/>
      <path d="M60,80 C55,83 50,87 46,92" stroke-width="1.1"/>
      <path d="M60,80 C65,83 70,87 74,92" stroke-width="1.1"/>
      <path d="M60,85 C55,89 50,94 47,99" stroke-width="1.1"/>
      <path d="M60,85 C65,89 70,94 73,99" stroke-width="1.1"/>
      <path d="M60,90 C56,94 52,99 49,104" stroke-width="1.1"/>
      <path d="M60,90 C64,94 68,99 71,104" stroke-width="1.1"/>
      <path d="M60,95 C57,99 54,104 52,109" stroke-width="1.1"/>
      <path d="M60,95 C63,99 66,104 68,109" stroke-width="1.1"/>
    </g>

  </g>
</svg>
